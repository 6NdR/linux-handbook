site_name: 6NdR

theme: 
  name: material
  language: fr
  logo: assets/images/bender-fourrure-3.png
  favicon: assets/images/bender-fourrure-3.ico
  features:
    - navigation.tabs
    - navigation.footer
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Passer en mode sombre
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/toggle-switch
        name: Passer en mode clair

extra:
  social:
