      link: https://github.com/6NdR
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/julienlediagon
    - icon: material/email
      link: mailto:6ndr.contact@gmail.com

copyright: Copyright &copy; 2025 - 6NdR

